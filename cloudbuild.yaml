steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build','-t','northamerica-northeast1-docker.pkg.dev/ci-cd-513007/ci-cd-test-artifacts/pyappimage:latest',"."] # if docker file is presnet in another dir specify it with -f path 

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push','northamerica-northeast1-docker.pkg.dev/ci-cd-513007/ci-cd-test-artifacts/pyappimage:latest']
  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pyflaskapp'
      - '--image'
      - 'northamerica-northeast1-docker.pkg.dev/ci-cd-513007/ci-cd-test-artifacts/pyappimage:latest'
      - --region
      - 'northamerica-northeast1'
      - '--allow-unauthenticated'
      
