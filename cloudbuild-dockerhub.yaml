steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args: ['-c','docker login --username=$$DOCKER_USER_NAME --password=$$DOCKER_PASSWORD']
    secretEnv: ['DOCKER_USER_NAME','DOCKER_PASSWORD']
  # skip the build trigger 
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args: ['-c', 'docker build -t $$DOCKER_USER_NAME/pyimage:latest .']
    secretEnv: ['DOCKER_USER_NAME']

  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args: ['-c', 'docker push  $$DOCKER_USER_NAME/pyimage:latest']
    secretEnv: ['DOCKER_USER_NAME']

availableSecrets:
  secretManager:
    - versionName: projects/776789252026/secrets/DOCKER_USER_NAME/versions/1
      env: DOCKER_USER_NAME

  
    - versionName: projects/776789252026/secrets/DOCKER_PASSWORD/versions/1
      env: DOCKER_PASSWORD

options:
  logging: CLOUD_LOGGING_ONLY

